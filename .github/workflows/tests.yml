name: Kiểm thử

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cài đặt
        run: pip install -e ".[dev]"
      - name: Chạy kiểm thử
        run: pytest -q
      - name: Kiểm tra ứng dụng chạy được với dữ liệu demo
        env:
          HASU_FORCE_DEMO: "1"
        run: |
          python - <<'PY'
          import pathlib, sys
          sys.path.insert(0, "app")   # giống khi chạy streamlit run app/streamlit_app.py
          from streamlit.testing.v1 import AppTest
          for page in sorted(pathlib.Path("app/views").glob("*.py")):
              if page.stem == "upload":
                  continue
              at = AppTest.from_file(str(page), default_timeout=120)
              at.run()
              assert not at.exception, f"{page.name}: {at.exception}"
              print("ok", page.name)
          PY
