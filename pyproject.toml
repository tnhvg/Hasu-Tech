[project]
name = "hasu"
version = "0.1.0"
description = "Phân tích bán hàng và dự báo nhu cầu cho cửa hàng bán lẻ (dữ liệu KiotViet)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "duckdb>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
