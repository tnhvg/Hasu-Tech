[project]
name = "hasu"
version = "0.1.0"
description = "Phân tích bán hàng và dự báo nhu cầu cho cửa hàng bán lẻ (dữ liệu KiotViet)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "mlxtend>=0.23",
    "statsforecast>=2.0",
    "mlforecast>=1.0",
    "lightgbm>=4.0",
    "shap>=0.45",
    "streamlit>=1.40",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Mô hình nền tảng Chronos (tuỳ chọn, cần tải mô hình từ Hugging Face)
chronos = ["chronos-forecasting>=1.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
